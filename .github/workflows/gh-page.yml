name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      # ---------- GAME 页的 wasm 构建（Odin + raylib → emscripten） ----------
      # 产物 pages/games/jump/web/ 不入库，每次部署由 CI 现编。
      # 本地开发时跑 `make -C pages/games/jump web` 生成同样一套。

      - name: 安装 Odin
        # 用官方 release（不是源码编译）：release 包里自带 raylib 的 wasm 静态库
        # libraylib.web.a / libraygui.a，源码仓库里那两个是 git-lfs 指针，拿不到真文件
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-09

      - name: 安装 Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      - name: 安装 wasm-ld
        # Odin 编译到 wasm 时调用 wasm-ld，官方 release 包不带，Ubuntu 上由 lld 提供
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: 检查工具链
        run: |
          odin version
          emcc --version | head -1
          wasm-ld --version
          ls "$(odin root)/vendor/raylib/wasm/"

      - name: 构建 wasm
        run: make -C pages/games/jump web

      # peaceiris 的发布流程是：先把 publish_dir 整个拷走，再在拷贝里 `git add --all`。
      # `.gitignore` 也在拷贝里，所以它会跳过 build/web/ —— 必须先把那条规则删掉。
      - name: 允许发布构建产物
        run: |
          grep -qxF '/**/build/' .gitignore # 先确认这行还在，免得哪天改了名静默发不出 wasm
          sed -i '\#^/\*\*/build/$#d' .gitignore

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: . # 发布仓库根目录（.gitignore 已在上一步处理）
          # 每次部署只保留一个提交（orphan 分支）：
          # 1) 部署分支不需要历史；2) 源码里一旦误提交大文件/测试产物，不会跟着部署历史一直留在仓库里
          force_orphan: true
